<!DOCTYPE html>
<html>
    <head>
        <title>Paseo en barco</title>
         <link rel="stylesheet" href="styleAct.css">
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
        </style>
    </head>
    <body>
         <header class="hat">

        <div class="brand">
            <img class="logo" src="logo.png" alt="Costa Sea Trips">
            <h1>Costa Sea Trips</h1>
        </div>

        <nav class="nav">
            <a href="/">Principal</a>
            <a href="/actividades" class="active">Actividades</a>
            <a href="/about">Sobre nosotros </a>
            <a href="/contact">Contacto</a>
            <a href="/faq">FAQ</a>
        </nav>

    </header>

    <section class="head">
        <div class="hero">
            <img src="paseito.jpg" alt="paseito">
        </div>
        <div class="title">
            <h1>Paseo en barco por la costa de Torrevieja</h1>
            <h2>Descubre la costa de Torrevieja desde el mar y disfruta de un paseo tranquilo con unas vistas increíbles.</h2>
        </div>
    
    </section>
    <div class="reserva">
        <h2>Reserva tu paseo por WhatsApp!</h2>
        <p>Duracion: 2 horas</p>
        <span><select class="peopleQ">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
        </select></span>
        <span>
            <button class="wspBtn">Reservar!</button>
        </span>
    </div>
    </body>
</html>
